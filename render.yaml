services:
  # Web Service running Full Stack Docker Container
  - type: web
    name: apna-vaidya
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://apna-vaidya.onrender.com,http://localhost:5173
