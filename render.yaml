services:
  # ApnaVaidya Java 17 Production REST API Backend
  - type: web
    name: apna-vaidya
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apnavaidya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://apnavaidya.vercel.app,http://localhost:5173,http://localhost:3000

databases:
  # Managed PostgreSQL Database Service on Render
  - name: apnavaidya-db
    plan: free
    region: oregon
    databaseName: apnavaidya
    user: apnavaidya_user
