version: '3.8'

services:
  apnavaidya:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apnavaidya_app
    ports:
      - "8080:8080" # Java 17 REST API
      - "3000:3000" # Web UI
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=ApnaVaidya_2026_Enterprise_Production_Secret_Key_98234!
      - VAULT_ENCRYPTION_KEY=ApnaVaidya_2026_Enterprise_AES256_Vault_Key_Production_98234!
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    volumes:
      - apnavaidya_data:/app/server/data
    restart: unless-stopped

volumes:
  apnavaidya_data:
    driver: local
